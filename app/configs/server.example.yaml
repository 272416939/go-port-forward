# Port Forward 隧道服务端配置示例
# 复制为 config.yaml 后按需修改；pf-server -c config.yaml 运行

# UDP 监听地址（中转机需在防火墙/安全组放行该端口）
listen: ":7947"

# 预共享密钥：留空使用与客户端一致的内置默认；生产环境务必修改为随机串
# 生成示例：openssl rand -hex 32
psk: ""

tun:
  name: pftun0          # TUN 接口名
  addr: "10.66.0.1/24"  # 服务端虚拟地址（客户端固定为 10.66.0.2）

nat:
  enabled: true         # 自动启用 ip_forward 并对隧道网段做 MASQUERADE（回包源地址改写）

sessions:
  # go-port-forward 的活跃会话接口；服务端据此把"玩家真实 IP 列表"
  # 推给 Windows 客户端维护 /32 回程路由
  url: "http://127.0.0.1:8989/api/sessions"
  username: ""          # 若 Web 面板开启了 Basic Auth 则填写
  password: ""
