<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Forward 隧道客户端</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Port Forward 隧道客户端</h1>
        <p class="sub">让后端服务器看到玩家的真实 IP</p>
      </div>
    </div>
    <div class="pill" id="statePill" data-state="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="stateText">未连接</span>
    </div>
  </header>

  <div id="elevateWarn" class="notice notice-warn" hidden>
    <strong>未以管理员身份运行。</strong>
    虚拟网卡、路由表与防火墙规则都需要管理员权限，请关闭本程序后右键选择「以管理员身份运行」。
  </div>

  <div id="errBox" class="notice notice-error" hidden></div>

  <main class="grid">
    <section class="card">
      <h2>连接</h2>
      <label class="field">
        <span>中转机地址</span>
        <input id="addr" type="text" placeholder="例如 1.2.3.4:7947" spellcheck="false"
               autocomplete="off" inputmode="url">
      </label>
      <p class="hint">省略端口时默认使用 7947。地址会自动记住，下次打开直接连接。</p>
      <div class="actions">
        <button id="btnConnect" class="btn btn-primary" type="button">连接</button>
        <button id="btnDisconnect" class="btn" type="button" hidden>断开</button>
        <button id="btnQuit" class="btn btn-quiet" type="button">退出程序</button>
      </div>
      <p class="hint">关闭浏览器页面不会退出程序，隧道会在后台继续工作。</p>
    </section>

    <section class="card">
      <h2>运行状态</h2>
      <dl class="stats">
        <div><dt>虚拟网卡</dt><dd id="tunIP">—</dd></div>
        <div><dt>已连接时长</dt><dd id="uptime">—</dd></div>
        <div><dt>入站包（玩家 → 后端）</dt><dd id="pktIn">0</dd></div>
        <div><dt>回程包（后端 → 玩家）</dt><dd id="pktOut">0</dd></div>
      </dl>
      <h3 class="sub-head">回程路由 <span class="count" id="routeCount">0</span></h3>
      <ul class="routes" id="routes"><li class="empty">暂无活跃玩家</li></ul>
    </section>
  </main>

  <section class="card card-wide">
    <h2>运行日志</h2>
    <pre class="logs" id="logs">等待操作…</pre>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
